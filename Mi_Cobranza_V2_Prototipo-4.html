<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07558a">
<title>Mi Cobranza V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7fb;color:#123047}
.app{max-width:480px;margin:auto;min-height:100vh;background:#f3f7fb}.top{background:#07558a;color:white;padding:18px 16px 16px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:22px}.top p{margin:4px 0 0;font-size:12px;opacity:.85}
main{padding:14px 14px 85px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 8px #00000010}.label{font-size:12px;color:#64788a}.value{font-size:21px;font-weight:700;margin-top:5px}.green{color:#07965b}.red{color:#df3e4c}.blue{color:#0874e8}
button{border:0;border-radius:11px;padding:12px 14px;background:#0874e8;color:white;font-weight:700;font-size:14px;cursor:pointer}.wide{width:100%;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tile{background:white;border-radius:14px;padding:15px 6px;text-align:center;font-size:12px;font-weight:700;box-shadow:0 2px 8px #0000000d}.tile span{display:block;font-size:23px;margin-bottom:7px}
.section{margin:16px 0 9px;font-weight:700}.item{background:white;border-radius:14px;padding:13px;margin:9px 0;box-shadow:0 2px 8px #0000000d;display:flex;justify-content:space-between;align-items:center}.small{font-size:12px;color:#637789}.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#dff7eb;color:#087a4d}.badge.red{background:#ffe2e5;color:#c52f3e}.badge.yellow{background:#fff0c7;color:#986800}
input,select{width:100%;padding:12px;border:1px solid #cbd9e4;border-radius:10px;margin:5px 0 10px;font-size:15px;background:white}label{font-size:12px;font-weight:700}.hidden{display:none}.back{background:transparent;padding:0 8px 0 0;font-size:22px}.form-title{display:flex;align-items:center;gap:8px;margin-bottom:14px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:white;border-top:1px solid #dbe5ec;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{background:white;color:#607487;padding:7px 2px;font-size:10px}.nav button.active{color:#0874e8}.nav span{display:block;font-size:19px;margin-bottom:2px}
.empty{text-align:center;padding:30px 10px;color:#718496}.row{display:flex;gap:8px}.row>*{flex:1}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>💰 Mi Cobranza V2</h1><p>Tu cobranza, siempre al día</p></header>
<main id="main"></main>
<nav class="nav">
<button onclick="home()" id="n-home"><span>⌂</span>Inicio</button>
<button onclick="clients()" id="n-clients"><span>👥</span>Clientes</button>
<button onclick="loans()" id="n-loans"><span>💰</span>Préstamos</button>
<button onclick="payments()" id="n-pay"><span>💳</span>Pagos</button>
<button onclick="more()" id="n-more"><span>☰</span>Más</button>
</nav>
</div>
<script>
const K='micobranza_v2_demo';
let db=JSON.parse(localStorage.getItem(K)||'{"clients":[],"loans":[],"payments":[]}');
const save=()=>localStorage.setItem(K,JSON.stringify(db));
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0);
const id=p=>p+Date.now()+Math.floor(Math.random()*99);
function nav(x){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));let e=document.getElementById('n-'+x);if(e)e.classList.add('active')}
function home(){nav('home');let total=db.loans.reduce((s,l)=>s+l.total,0), paid=db.payments.reduce((s,p)=>s+p.amount,0);main.innerHTML=`<h2>Resumen general</h2><div class="cards"><div class="card"><div class="label">💵 Cobrado</div><div class="value green">${money(paid)}</div></div><div class="card"><div class="label">⏳ Por cobrar</div><div class="value blue">${money(Math.max(0,total-paid))}</div></div><div class="card"><div class="label">👥 Clientes</div><div class="value">${db.clients.length}</div></div><div class="card"><div class="label">💳 Pagos</div><div class="value">${db.payments.length}</div></div></div><button class="wide" onclick="newClient()">＋ Nuevo cliente</button><div class="grid"><div class="tile" onclick="clients()"><span>👥</span>Clientes</div><div class="tile" onclick="newLoan()"> <span>💰</span>Préstamo</div><div class="tile" onclick="payments()"><span>💳</span>Cobranza</div><div class="tile" onclick="mp()"><span>🟢</span>Mercado Pago</div><div class="tile" onclick="reports()"><span>📊</span>Reportes</div><div class="tile" onclick="more()"><span>⚙️</span>Configuración</div></div>`}
function clients(){nav('clients');main.innerHTML=`<h2>Clientes</h2><button class="wide" onclick="newClient()">＋ Nuevo cliente</button>${db.clients.length?db.clients.map(c=>`<div class="item" onclick="clientView('${c.id}')"><div><b>${c.name}</b><div class="small">DNI: ${c.dni||'-'} · ${c.phone||'-'}</div></div><span class="badge">Activo</span></div>`).join(''):'<div class="empty">Todavía no hay clientes.<br>Agregá el primero.</div>'}`}
function newClient(){main.innerHTML=`<div class="form-title"><button class="back" onclick="clients()">‹</button><h2>Nuevo cliente</h2></div><label>Nombre y apellido *</label><input id="name" placeholder="Ej. Juan Pérez"><label>DNI</label><input id="dni" inputmode="numeric"><label>Teléfono</label><input id="phone" inputmode="tel"><label>Dirección</label><input id="addr"><label>Alias / CVU (opcional)</label><input id="alias"><label>Notas</label><input id="notes"><button class="wide" onclick="saveClient()">Guardar cliente</button>`}
function saveClient(){let name=document.getElementById('name').value.trim();if(!name)return alert('Ingresá el nombre del cliente.');db.clients.push({id:id('c'),name,dni:dni.value,phone:phone.value,addr:addr.value,alias:alias.value,notes:notes.value});save();clients()}
function clientView(cid){let c=db.clients.find(x=>x.id===cid), ls=db.loans.filter(l=>l.clientId===cid);main.innerHTML=`<div class="form-title"><button class="back" onclick="clients()">‹</button><h2>${c.name}</h2></div><div class="card"><b>DNI:</b> ${c.dni||'-'}<br><b>Teléfono:</b> ${c.phone||'-'}<br><b>Alias:</b> ${c.alias||'-'}</div><button class="wide" onclick="newLoan('${cid}')">＋ Nuevo préstamo</button><div class="section">Préstamos</div>${ls.length?ls.map(l=>`<div class="item" onclick="loanView('${l.id}')"><div><b>${money(l.capital)}</b><div class="small">${l.qty} cuotas · ${l.days} días · cuota ${money(l.installment)}</div></div><span class="badge">${money(l.paid)} pagado</span></div>`).join(''):'<div class="empty">Sin préstamos.</div>'}`}
function newLoan(pre=''){let opts=db.clients.map(c=>`<option value="${c.id}" ${c.id===pre?'selected':''}>${c.name}</option>`).join('');main.innerHTML=`<div class="form-title"><button class="back" onclick="clients()">‹</button><h2>Nuevo préstamo</h2></div><label>Cliente *</label><select id="lc">${opts}</select><label>Monto prestado *</label><input id="cap" type="number" placeholder="1000000"><label>Fecha</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Plan de cuotas</label><select id="days"><option value="15">15 días</option><option value="21">21 días</option></select><label>Cantidad de cuotas</label><input id="qty" type="number" value="10"><label>Importe de cada cuota</label><input id="inst" type="number" placeholder="130000"><button class="wide" onclick="saveLoan()">Crear préstamo y cuotas</button>`}
function saveLoan(){let clientId=lc.value,capital=+cap.value,daysN=+days.value,qtyN=+qty.value,instN=+inst.value;if(!clientId||!capital||!qtyN||!instN)return alert('Completá cliente, monto, cuotas e importe.');let l={id:id('l'),clientId,capital,days:daysN,qty:qtyN,installment:instN,total:instN*qtyN,paid:0,date:date.value,cuotas:[]};for(let i=1;i<=qtyN;i++){let d=new Date(date.value+'T12:00:00');d.setDate(d.getDate()+daysN*i);l.cuotas.push({n:i,due:d.toISOString().slice(0,10),amount:instN,status:'Pendiente'});}db.loans.push(l);save();loanView(l.id)}
function loans(){nav('loans');main.innerHTML=`<h2>Préstamos</h2><button class="wide" onclick="newLoan()">＋ Nuevo préstamo</button>${db.loans.length?db.loans.map(l=>{let c=db.clients.find(x=>x.id===l.clientId);return `<div class="item" onclick="loanView('${l.id}')"><div><b>${c?c.name:'Cliente'}</b><div class="small">${money(l.capital)} · ${l.qty} cuotas · ${l.days} días</div></div><span class="badge">${money(l.paid)}</span></div>`}).join(''):'<div class="empty">Todavía no hay préstamos.</div>'}`}
function loanView(lid){let l=db.loans.find(x=>x.id===lid),c=db.clients.find(x=>x.id===l.clientId);main.innerHTML=`<div class="form-title"><button class="back" onclick="loans()">‹</button><h2>Cuotas</h2></div><div class="card"><b>${c?.name||''}</b><div class="small">${money(l.capital)} · ${l.qty} cuotas · ${l.days} días</div><div class="row"><div><div class="label">Pagado</div><b class="green">${money(l.paid)}</b></div><div><div class="label">Pendiente</div><b class="blue">${money(l.total-l.paid)}</b></div></div></div>${l.cuotas.map(q=>`<div class="item"><div><b>Cuota ${q.n}</b><div class="small">Vence ${q.due} · ${money(q.amount)}</div></div><span class="badge ${q.status==='Pagada'?'':'yellow'}">${q.status}</span></div>`).join('')}<button class="wide" onclick="payFor('${l.id}')">💳 Registrar pago</button>`}
function payFor(lid){let l=db.loans.find(x=>x.id===lid),c=db.clients.find(x=>x.id===l.clientId),q=l.cuotas.find(x=>x.status==='Pendiente');if(!q)return alert('Este préstamo ya está totalmente pagado.');main.innerHTML=`<div class="form-title"><button class="back" onclick="loanView('${lid}')">‹</button><h2>Registrar pago</h2></div><div class="card"><b>${c.name}</b><div class="small">Cuota ${q.n} de ${l.qty} · Vence ${q.due}</div></div><label>Importe recibido</label><input id="pa" type="number" value="${q.amount}"><label>Medio de pago</label><select id="method"><option>Mercado Pago</option><option>Naranja X</option><option>Efectivo</option><option>Otro</option></select><label>Observación</label><input id="obs"><button class="wide" onclick="savePay('${lid}','${q.n}')">Confirmar pago</button>`}
function savePay(lid,n){let l=db.loans.find(x=>x.id===lid),q=l.cuotas.find(x=>x.n==n),amount=+pa.value;if(!amount)return alert('Ingresá un importe.');q.status='Pagada';l.paid+=amount;db.payments.push({id:id('p'),clientId:l.clientId,loanId:lid,quota:+n,amount,date:new Date().toLocaleString('es-AR'),method:method.value,status:'Registrado',obs:obs.value});save();loanView(lid)}
function payments(){nav('pay');main.innerHTML=`<h2>Historial de pagos</h2>${db.payments.length?db.payments.slice().reverse().map(p=>{let c=db.clients.find(x=>x.id===p.clientId);return `<div class="item"><div><b>${c?.name||''}</b><div class="small">Cuota ${p.quota} · ${p.method} · ${p.date}</div></div><b class="green">${money(p.amount)}</b></div>`}).join(''):'<div class="empty">Todavía no hay pagos registrados.</div>'}`}
function mp(){main.innerHTML=`<h2>Mercado Pago</h2><div class="card"><b>🟢 Conciliación</b><p class="small">Esta versión de prueba todavía no conecta tu cuenta real. Primero probamos la gestión de clientes, préstamos, cuotas y pagos.</p><button class="wide" onclick="alert('La conexión real con Mercado Pago se agrega en la siguiente etapa, con credenciales seguras.')">Conectar Mercado Pago</button></div><div class="section">Movimientos</div><div class="empty">No hay movimientos importados.</div>`}
function reports(){let paid=db.payments.reduce((s,p)=>s+p.amount,0);main.innerHTML=`<h2>Reportes</h2><div class="cards"><div class="card"><div class="label">Total cobrado</div><div class="value green">${money(paid)}</div></div><div class="card"><div class="label">Préstamos</div><div class="value">${db.loans.length}</div></div></div>`}
function more(){nav('more');main.innerHTML=`<h2>Configuración</h2><div class="item"><div><b>Mercado Pago</b><div class="small">Conexión todavía no configurada</div></div><button onclick="mp()">Abrir</button></div><div class="item"><div><b>Datos</b><div class="small">Se guardan en este dispositivo</div></div><span>🔐</span></div><div class="item"><div><b>Mi Cobranza V2</b><div class="small">Versión de prueba</div></div><span>V2</span></div>`}
home();
</script>
</body>
</html>
